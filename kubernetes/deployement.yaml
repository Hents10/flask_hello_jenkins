apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
          - name: flask-app
            image: 192.168.49.2:30500/pythontest:latest
            imagePullPolicy: Always
            ports:
              - containerPort: 5000
            env:
              - name: FLASK_ENV
                value: "production"
